services:
  db:
    container_name: taskflow-db
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      # Loopback-only: the database is reachable only from this machine.
      - "127.0.0.1:1434:1433"
    volumes:
      - taskflow_sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    container_name: taskflow-api
    build:
      context: .
      dockerfile: src/TaskFlow.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Sql__Host: db
      Sql__Port: "1433"
      Sql__Database: TaskFlow
      Sql__Password: ${MSSQL_SA_PASSWORD}
      Jwt__Issuer: TaskFlow.Api
      Jwt__Audience: TaskFlow.Client
      Jwt__AccessTokenMinutes: "15"
      Jwt__Secret: ${JWT_SECRET}
      Cors__AllowedOrigins__0: http://localhost:5233
    ports:
      - "127.0.0.1:5099:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: taskflow-web
    build:
      context: .
      dockerfile: src/TaskFlow.Web/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
    ports:
      - "127.0.0.1:5233:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  taskflow_sqlserver_data:
